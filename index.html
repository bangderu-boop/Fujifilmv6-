<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fujifilm Simulation Web App Pro</title>
  <style>
    :root {
      --fuji-bg: #121212;
      --fuji-panel: #1e1e1e;
      --fuji-accent: #e50914;
      --fuji-text: #e0e0e0;
      --fuji-border: #333;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: var(--fuji-bg);
      color: var(--fuji-text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      height: 50px;
      background: #000;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--fuji-accent);
      z-index: 10;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 2px;
    }

    header h1 span { 
      color: var(--fuji-accent); 
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    .preview-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 1px solid var(--fuji-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .controls-panel {
      width: 360px;
      height: 100%;
      background: var(--fuji-panel);
      padding: 20px;
      box-sizing: border-box;
      border-left: 1px solid var(--fuji-border);
      overflow-y: auto;
    }

    @media (max-width: 850px) {
      html, body {
        overflow: auto;
      }
      .main-container { 
        flex-direction: column; 
        height: auto;
        overflow: visible;
      }
      .preview-container {
        position: sticky;
        top: 0;
        z-index: 5;
        height: 45vh;
        padding: 10px;
        border-bottom: 1px solid var(--fuji-border);
      }
      .controls-panel { 
        width: 100%; 
        height: auto;
        border-left: none;
        padding-bottom: 40px;
        overflow-y: visible;
      }
    }

    .section-title {
      font-size: 0.8rem;
      color: var(--fuji-accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 15px 0 10px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 3px;
    }
    .control-group {
      margin-bottom: 14px;
    }
    .control-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 5px;
      color: #aaa;
    }
    select, input[type="range"], input[type="text"] {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    .val-display {
      float: right;
      color: var(--fuji-accent);
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      background: var(--fuji-accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      flex: 1;
      text-align: center;
    }
    .btn-secondary {
      background: #333;
      color: #ccc;
    }
    .btn-secondary:hover { background: #444; }
    .btn-reset {
      background: #555;
      color: #fff;
    }
    .btn-reset:hover { background: #666; }
    .btn:hover { opacity: 0.9; }
    .preset-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
    }
    .preset-btn {
      flex: 1;
      background: #252525;
      border: 1px solid #444;
      color: #888;
      padding: 6px 0;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 3px;
    }
    .preset-btn.active {
      background: var(--fuji-accent);
      color: white;
      border-color: var(--fuji-accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>FUJIFILM <span>SIMULATOR PRO</span></h1>
    <input type="file" id="imageInput" accept="image/*" style="width: auto;">
  </header>

  <div class="main-container">
    <div class="preview-container">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls-panel">
      <div class="section-title">Custom Presets</div>
      <div class="preset-bar">
        <button class="preset-btn active" data-slot="C1">C1</button>
        <button class="preset-btn" data-slot="C2">C2</button>
        <button class="preset-btn" data-slot="C3">C3</button>
        <button class="preset-btn" data-slot="C4">C4</button>
        <button class="preset-btn" data-slot="C5">C5</button>
        <button class="preset-btn" data-slot="C6">C6</button>
        <button class="preset-btn" data-slot="C7">C7</button>
      </div>

      <div class="section-title">Base Film Simulation</div>
      <div class="control-group">
        <select id="simulation">
          <option value="provia">PROVIA / Standard</option>
          <option value="velvia">VELVIA / Vivid</option>
          <option value="classic_chrome">CLASSIC CHROME</option>
          <option value="classic_neg">CLASSIC Neg.</option>
          <option value="reala_ace">REALA ACE</option>
          <option value="acros">ACROS (Monochrome)</option>
        </select>
      </div>

      <div class="section-title">Color & WB Shift</div>
      <div class="control-group">
        <label for="wbR">WB Shift Red <span class="val-display" id="wbRVal">0</span></label>
        <input type="range" id="wbR" min="-9" max="9" value="0">
      </div>
      <div class="control-group">
        <label for="wbB">WB Shift Blue <span class="val-display" id="wbBVal">0</span></label>
        <input type="range" id="wbB" min="-9" max="9" value="0">
      </div>
      <div class="control-group">
        <label for="color">Color Saturation <span class="val-display" id="colorVal">0</span></label>
        <input type="range" id="color" min="-4" max="4" value="0">
      </div>
      <div class="control-group">
        <label for="fxBlue">Color Chrome FX Blue <span class="val-display" id="fxBlueVal">0</span></label>
        <input type="range" id="fxBlue" min="0" max="2" value="0">
      </div>
      <div class="control-group" id="monoShiftGroup" style="display:none;">
        <label for="monoShift">Monochromatic Color (Warm/Cool) <span class="val-display" id="monoShiftVal">0</span></label>
        <input type="range" id="monoShift" min="-5" max="5" value="0">
      </div>

      <div class="section-title">Tone & Clarity</div>
      <div class="control-group">
        <label for="highlight">Highlight Tone <span class="val-display" id="highlightVal">0</span></label>
        <input type="range" id="highlight" min="-2" max="4" step="0.5" value="0">
      </div>
      <div class="control-group">
        <label for="shadow">Shadow Tone <span class="val-display" id="shadowVal">0</span></label>
        <input type="range" id="shadow" min="-2" max="4" step="0.5" value="0">
      </div>
      <div class="control-group">
        <label for="clarity">Clarity <span class="val-display" id="clarityVal">0</span></label>
        <input type="range" id="clarity" min="-5" max="5" value="0">
      </div>
      <div class="control-group">
        <label for="vignette">Vignette (ขอบมืด/สว่าง) <span class="val-display" id="vignetteVal">0</span></label>
        <input type="range" id="vignette" min="-10" max="10" value="0">
      </div>

      <div class="section-title">Grain Effect</div>
      <div class="control-group">
        <label for="grain">Grain Amount <span class="val-display" id="grainVal">0</span></label>
        <input type="range" id="grain" min="0" max="40" value="0">
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" id="compareBtn">Hold to Compare</button>
        <button class="btn btn-reset" id="resetBtn">Reset</button>
        <button class="btn" id="downloadBtn">Save Photo</button>
      </div>

      <div class="section-title">Recipe Sharing</div>
      <div class="control-group">
        <input type="text" id="recipeJson" placeholder="Recipe JSON Code">
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="exportBtn">Export Code</button>
        <button class="btn btn-secondary" id="importBtn">Import Code</button>
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageInput = document.getElementById('imageInput');
    
    let loadedImage = null;
    let previewCanvas = document.createElement('canvas');
    let previewCtx = previewCanvas.getContext('2d');
    
    let isComparing = false;
    let activeSlot = 'C1';
    let renderAnimationFrame = null;

    const defaultSettings = {
      simulation: 'provia', wbR: '0', wbB: '0', color: '0', fxBlue: '0',
      monoShift: '0', highlight: '0', shadow: '0', clarity: '0', vignette: '0', grain: '0'
    };

    const controls = {
      simulation: document.getElementById('simulation'),
      wbR: document.getElementById('wbR'),
      wbB: document.getElementById('wbB'),
      color: document.getElementById('color'),
      fxBlue: document.getElementById('fxBlue'),
      monoShift: document.getElementById('monoShift'),
      highlight: document.getElementById('highlight'),
      shadow: document.getElementById('shadow'),
      clarity: document.getElementById('clarity'),
      vignette: document.getElementById('vignette'),
      grain: document.getElementById('grain')
    };

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeSlot = e.target.dataset.slot;
        loadPreset(activeSlot);
      });
    });

    function requestRender() {
      if (renderAnimationFrame) cancelAnimationFrame(renderAnimationFrame);
      renderAnimationFrame = requestAnimationFrame(renderPreview);
    }

    Object.keys(controls).forEach(key => {
      controls[key].addEventListener('input', (e) => {
        if(key !== 'simulation') document.getElementById(key + 'Val').innerText = e.target.value;
        if(key === 'simulation') {
          document.getElementById('monoShiftGroup').style.display = (e.target.value === 'acros') ? 'block' : 'none';
        }
        savePreset(activeSlot);
        requestRender();
      });
    });

    // ใช้ URL.createObjectURL ป้องกันจอขาวจากปัญหา FileReader CORS
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        loadedImage = img;

        const MAX_PREVIEW_WIDTH = 1000;
        let scale = 1;
        if (img.width > MAX_PREVIEW_WIDTH) {
          scale = MAX_PREVIEW_WIDTH / img.width;
        }
        
        previewCanvas.width = Math.floor(img.width * scale);
        previewCanvas.height = Math.floor(img.height * scale);
        
        canvas.width = previewCanvas.width;
        canvas.height = previewCanvas.height;

        previewCtx.drawImage(img, 0, 0, previewCanvas.width, previewCanvas.height);
        requestRender();
      };
      img.src = URL.createObjectURL(file);
    });

    const compareBtn = document.getElementById('compareBtn');
    compareBtn.addEventListener('mousedown', () => { isComparing = true; requestRender(); });
    compareBtn.addEventListener('mouseup', () => { isComparing = false; requestRender(); });
    compareBtn.addEventListener('mouseleave', () => { if(isComparing) { isComparing = false; requestRender(); } });
    compareBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isComparing = true; requestRender(); });
    compareBtn.addEventListener('touchend', (e) => { e.preventDefault(); isComparing = false; requestRender(); });

    document.getElementById('resetBtn').addEventListener('click', () => {
      Object.keys(defaultSettings).forEach(k => {
        if (controls[k]) {
          controls[k].value = defaultSettings[k];
          if(k !== 'simulation') document.getElementById(k + 'Val').innerText = defaultSettings[k];
        }
      });
      document.getElementById('monoShiftGroup').style.display = 'none';
      savePreset(activeSlot);
      requestRender();
    });

    function applyFilters(targetCtx, width, height) {
      let imgData;
      try {
        imgData = targetCtx.getImageData(0, 0, width, height);
      } catch (err) {
        return; // ป้องกันค้างถ้าเข้าถึงข้อมูลไม่ได้
      }

      const data = imgData.data;

      const sim = controls.simulation.value;
      const wbR = parseInt(controls.wbR.value) * 6;
      const wbB = parseInt(controls.wbB.value) * 6;
      const highlight = parseFloat(controls.highlight.value);
      const shadow = parseFloat(controls.shadow.value);
      const satAdjust = parseInt(controls.color.value) * 0.12;
      const fxBlue = parseInt(controls.fxBlue.value);
      const monoShift = parseInt(controls.monoShift.value);
      const clarity = parseInt(controls.clarity.value);
      const vignetteVal = parseInt(controls.vignette.value);
      const grainAmount = parseInt(controls.grain.value);

      const centerX = width / 2;
      const centerY = height / 2;
      const maxDistSq = centerX * centerX + centerY * centerY;
      const vignetteFactor = vignetteVal * 0.08;

      let idx = 0;
      for (let y = 0; y < height; y++) {
        const dy = y - centerY;
        const dySq = dy * dy;

        for (let x = 0; x < width; x++) {
          let r = data[idx], g = data[idx+1], b = data[idx+2];

          if (sim === 'velvia') {
            r *= 1.15; g *= 1.08; b *= 0.92;
          } else if (sim === 'classic_chrome') {
            const gray = 0.3 * r + 0.59 * g + 0.11 * b;
            r = r * 0.68 + gray * 0.32;
            g = g * 0.78 + gray * 0.22;
            b = b * 0.72 + gray * 0.28;
          } else if (sim === 'classic_neg') {
            r = (r * r / 255) + 12; g = g * 1.05; b = b * 0.85 - 12;
          } else if (sim === 'reala_ace') {
            r = r * 1.05 + 2; g = g * 1.02; b = b * 0.98;
          } else if (sim === 'acros') {
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            r = g = b = gray;
            if (monoShift !== 0) {
              r += monoShift * 4; b -= monoShift * 4;
            }
          }

          r += wbR; b += wbB;
          if (sim !== 'acros' && satAdjust !== 0) {
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            r = gray + (r - gray) * (1 + satAdjust);
            g = gray + (g - gray) * (1 + satAdjust);
            b = gray + (b - gray) * (1 + satAdjust);
          }

          if (sim !== 'acros' && fxBlue > 0 && b > r && b > g) {
            b *= (1 + fxBlue * 0.15);
          }

          const lum = (r + g + b) * 0.3333;
          if (lum > 128 && highlight !== 0) {
            const boost = highlight * 12 * ((lum - 128) / 127);
            r += boost; g += boost; b += boost;
          }
          if (lum <= 128 && shadow !== 0) {
            const boost = shadow * 12 * ((128 - lum) / 128);
            r += boost; g += boost; b += boost;
          }

          if (clarity !== 0 && lum > 64 && lum < 192) {
            const factor = (1 - Math.abs(lum - 128) / 64) * clarity * 3;
            r += factor; g += factor; b += factor;
          }

          if (vignetteVal !== 0) {
            const dx = x - centerX;
            const distRatioSq = (dx * dx + dySq) / maxDistSq;
            const factor = Math.sqrt(distRatioSq * distRatioSq * distRatioSq) * vignetteFactor;

            if (vignetteVal < 0) {
              r *= (1 + factor); g *= (1 + factor); b *= (1 + factor);
            } else {
              r += (255 - r) * factor; g += (255 - g) * factor; b += (255 - b) * factor;
            }
          }

          if (grainAmount > 0) {
            const noise = (Math.random() - 0.5) * grainAmount;
            r += noise; g += noise; b += noise;
          }

          data[idx]     = r < 0 ? 0 : (r > 255 ? 255 : r);
          data[idx + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
          data[idx + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);

          idx += 4;
        }
      }

      targetCtx.putImageData(imgData, 0, 0);
    }

    function renderPreview() {
      if (!loadedImage) return;

      ctx.drawImage(previewCanvas, 0, 0);
      if (isComparing) return;

      applyFilters(ctx, canvas.width, canvas.height);
    }

    function getCurrentConfig() {
      const cfg = {};
      Object.keys(controls).forEach(k => cfg[k] = controls[k].value);
      return cfg;
    }

    function savePreset(slot) {
      try {
        localStorage.setItem(`fuji_preset_${slot}`, JSON.stringify(getCurrentConfig()));
      } catch(e) {}
    }

    function loadPreset(slot) {
      try {
        const saved = localStorage.getItem(`fuji_preset_${slot}`);
        if (!saved) return;
        const cfg = JSON.parse(saved);
        Object.keys(cfg).forEach(k => {
          if (controls[k]) {
            controls[k].value = cfg[k];
            if(k !== 'simulation') document.getElementById(k + 'Val').innerText = cfg[k];
          }
        });
        document.getElementById('monoShiftGroup').style.display = (controls.simulation.value === 'acros') ? 'block' : 'none';
        requestRender();
      } catch(e) {}
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      const jsonStr = JSON.stringify(getCurrentConfig());
      document.getElementById('recipeJson').value = jsonStr;
      navigator.clipboard.writeText(jsonStr);
      alert('คัดลอกโค้ดสูตรฟิล์มเรียบร้อยแล้ว!');
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      try {
        const cfg = JSON.parse(document.getElementById('recipeJson').value);
        Object.keys(cfg).forEach(k => {
          if (controls[k]) {
            controls[k].value = cfg[k];
            if(k !== 'simulation') document.getElementById(k + 'Val').innerText = cfg[k];
          }
        });
        savePreset(activeSlot);
        requestRender();
      } catch(e) {
        alert('โค้ดสูตรไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
      }
    });
// แทรกโค้ด 3 บรรทัดนี้ต่อท้ายลงไปได้เลยครับ
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('recipeJson').value = '';
    });
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!loadedImage) return alert('กรุณาเลือกรูปภาพก่อนครับ');

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.innerText = 'Processing...';
      downloadBtn.disabled = true;

      setTimeout(() => {
        const fullCanvas = document.createElement('canvas');
        const fullCtx = fullCanvas.getContext('2d');
        
        fullCanvas.width = loadedImage.width;
        fullCanvas.height = loadedImage.height;
        fullCtx.drawImage(loadedImage, 0, 0);

        applyFilters(fullCtx, fullCanvas.width, fullCanvas.height);

        const link = document.createElement('a');
        link.download = `fuji_${activeSlot}_photo.jpg`;
        link.href = fullCanvas.toDataURL('image/jpeg', 0.95);
        link.click();

        downloadBtn.innerText = 'Save Photo';
        downloadBtn.disabled = false;
      }, 50);
    });

    loadPreset('C1');
  </script>
</body>
</html>
